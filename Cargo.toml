[package]
name = "sasyndev_control"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "SasyndevCONTROL"
path = "src/main.rs"

[dependencies]
tao = "0.37.3"
wry = { version = "0.57.3", features = ["devtools"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"
ureq = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winres = "0.1.12"
