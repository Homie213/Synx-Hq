<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 400px; height: 280px;
  background: transparent;
  font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.card {
  width: 400px; height: 280px;
  background: linear-gradient(160deg, #1E0612 0%, #0A0106 100%);
  border-radius: 20px;
  border: 1px solid rgba(232,39,58,.2);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0;
  box-shadow: 0 32px 80px rgba(0,0,0,.6);
}
.logo {
  width: 72px; height: 72px;
  border-radius: 20px;
  margin-bottom: 20px;
}
.name {
  font-size: 26px; font-weight: 700;
  letter-spacing: -.04em;
  color: #fff;
  margin-bottom: 6px;
}
.sub {
  font-size: 13px; color: rgba(255,255,255,.4);
  margin-bottom: 28px;
}
.bar-track {
  width: 180px; height: 3px;
  background: rgba(255,255,255,.08);
  border-radius: 999px; overflow: hidden;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #E8273A, #FF6B7A);
  border-radius: 999px;
  animation: load 2.5s ease-in-out infinite;
}
@keyframes load {
  0%   { width: 0%;   margin-left: 0; }
  50%  { width: 60%;  margin-left: 20%; }
  100% { width: 0%;   margin-left: 100%; }
}
.status {
  margin-top: 14px;
  font-size: 12px; color: rgba(255,255,255,.3);
  letter-spacing: .02em;
}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="../../assets/icon.png" onerror="this.style.display='none'">
  <div class="name">Replix</div>
  <div class="sub">AI Clip Maker</div>
  <div class="bar-track"><div class="bar-fill"></div></div>
  <div class="status">Starting up…</div>
</div>
</body>
</html>
