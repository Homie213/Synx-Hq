name: Keep Render Server Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes
  workflow_dispatch:           # Manual trigger too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Replix server
        run: |
          curl -f https://replix-server.onrender.com/healthz || echo "Server not responding"
