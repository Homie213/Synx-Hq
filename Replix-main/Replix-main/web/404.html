<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Replix</title>
<link rel="icon" href="/brand/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0106;font-family:"Geist","Segoe UI",system-ui,sans-serif;color:#F5EAEC;text-align:center;padding:24px}
.wrap{max-width:480px;width:100%}
.icon{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#E8273A,#9A1225);display:grid;place-items:center;margin:0 auto 28px;box-shadow:0 12px 40px rgba(232,39,58,.35)}
.icon svg{width:36px;height:36px;fill:#fff}
.code{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(232,39,58,.8);margin-bottom:12px}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;color:#fff;margin-bottom:12px}
p{font-size:15px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:32px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:0;transition:opacity .15s ease}
.btn:hover{opacity:.85}
.btn-primary{background:#E8273A;color:#fff}
.btn-ghost{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div class="noise"></div>
<div class="wrap">
  <div class="icon">
    <svg viewBox="0 0 256 256"><path d="M208,80H168V56a40,40,0,0,0-80,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM104,56a24,24,0,0,1,48,0V80H104Zm104,152H48V96H208Zm-80-32a28,28,0,1,0-28-28A28,28,0,0,0,128,176Zm0-40a12,12,0,1,1-12,12A12,12,0,0,1,128,136Z"/></svg>
  </div>
  <div class="code">Error 404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Head back to the app to continue clipping.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/app">Go to Replix</a>
    <a class="btn btn-ghost" href="https://discord.gg/2t8rXUdgQ4" target="_blank" rel="noopener">Get support</a>
  </div>
</div>
</body>
</html>
